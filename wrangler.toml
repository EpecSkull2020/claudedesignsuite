name = "claudedesignsuite"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Tiny router model (Workers AI, free daily allowance) that picks Haiku / Sonnet / Opus per request.
[ai]
binding = "AI"

